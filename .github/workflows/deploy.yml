name: Deploy to WordPress.org

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wporg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Composer production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Get version and check if version tag exists
        id: version_check
        run: |
          VERSION=$(grep -i '^Stable tag:' readme.txt | awk '{print $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1 || git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "tag_version=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION tag already exists. Updating trunk & assets only without releasing new tag."
          else
            echo "tag_version=true" >> "$GITHUB_OUTPUT"
            echo "New version $VERSION detected. Creating new release tag."
          fi

      - name: Deploy to WordPress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: raeen-repeater-field-for-acf
          VERSION: ${{ steps.version_check.outputs.version }}
          TAG_VERSION: ${{ steps.version_check.outputs.tag_version }}
          ASSETS_DIR: .wordpress-org